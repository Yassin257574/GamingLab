<style>

.dd.roll{animation:dtum .85s cubic-bezier(.3,.7,.4,1) both}.dd.roll2{animation:dtum .85s cubic-bezier(.3,.7,.4,1) .06s both reverse}

<script>
// ================= أدوات =================
const $=id=>document.getElementById(id),clone=o=>JSON.parse(JSON.stringify(o)),rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const r10=v=>Math.round(v/10)*10,r50=v=>Math.round(v/50)*50,clean=x=>String(x||'').replace(/[<>&"'`\\]/g,'').trim().slice(0,12);
const fmt=n=>(n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('en-US');
const sleep=ms=>new Promise(r=>setTimeout(r,ms*(PF.anim==='fast'?.45:1)));

// ================= تفضيلات الجهاز (مش بتأثر على باقي اللاعبين) =================
const PF0={theme:'dark',big:0,cam:'all',t3:0,snd:1,vib:1,anim:'normal',roast:'yassin',wake:1,fit:1};
let PF=Object.assign({},PF0);try{Object.assign(PF,JSON.parse(localStorage.getItem('bkpf3')||'{}'))}catch(e){}
function setPF(k,v){PF[k]=v;try{localStorage.setItem('bkpf3',JSON.stringify(PF))}catch(e){}CAM=null;render()}
const vib=p=>{if(!PF.vib)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

// ================= اللوحة =================
// 11 محافظة × 3 أماكن، الأسعار بتزيد مع كل خانة (التانية أغلى من الأولى وهكذا)
const GV=[
 ['القليوبية','#a1785a',['أبو زعبل','المرج','الخانكة']],
 ['المنوفية','#7fb2d4',['منوف','شبين الكوم','مدينة السادات']],
 ['الفيوم','#cf8db0',['قرية تونس','بحيرة قارون','وادي الريان']],
 ['دمياط','#e09a5c',['فارسكور','عزبة البرج','رأس البر']],
 ['بورسعيد','#d46f6f',['حي العرب','حي الشرق','بورفؤاد']],
 ['أسوان','#d8bb4c',['النوبة','جزيرة فيلة','السد العالي']],
 ['الأقصر','#6fb381',['البر الغربي','معبد الكرنك','وادي الملوك']],
 ['الإسكندرية','#4d86c9',['محطة الرمل','سموحة','ستانلي']],
 ['جنوب سيناء','#3aaea4',['نويبع','دهب','شرم الشيخ']],
 ['الجيزة','#957bd0',['الدقي','المهندسين','الأهرامات']],
 ['القاهرة','#3f4f82',['وسط البلد','المعادي','الزمالك']]];
const GC=[...GV.map(g=>g[1]),'#8a93a8'];
const PR=[[300,330,360],[400,440,480],[520,560,600],[640,690,740],[780,830,880],[920,980,1040],[1080,1150,1220],[1260,1340,1420],[1460,1550,1640],[1680,1780,1880],[1920,2050,2200]];

const setDrawn=(s,k,w)=>{s.drawn=k;s.dn=(s.dn||0)+1;s.dw=w||s.pl[s.turn].name};
function endTurn(s){const p=s.pl[s.turn];s.pend=null;if(p.out){nextTurn(s);return}if(p.extra&&!p.jail){p.extra=0;s.stage='move';lg(s,'🎲 '+p.name+' هيلعب تاني');return}p.extra=0;s.stage='after'}
function nextTurn(s){s.tn=(s.tn||0)+1;s.stage='move';s.pend=null;const p=s.pl[s.turn];
 if(p.mag!=null&&!p.out&&!p.jail){const k=rnd(PEN(s));p.mag=null;p.pos=FI;setDrawn(s,k,p.name);lg(s,'🧲 كمين المرور سحب '+p.name+' من جنبه!');trafficRoast(s,s.turn);doPen(s,s.turn,k)}
 for(;;){if(s.pl.filter(x=>!x.out).length<=1||(s.cfg.first&&s.pl.some(x=>x.out&&!x.kick))){s.phase='end';return}
  s.turn++;if(s.turn>=s.pl.length){s.turn=0;s.round++;if(s.cfg.chaos)chaos(s)}
  const q=s.pl[s.turn];if(q.out)continue;
  const dd=q.debts.filter(d=>d.due<=s.round);dd.forEach(d=>{lg(s,'📝 '+q.name+' سدد '+(d.loan?'السلفة ':'دين ')+d.amt);pay(s,s.turn,d.amt,-2)});q.debts=q.debts.filter(d=>d.due>s.round);
  if(q.skip){q.skip=0;if(s.cfg.jail==='skip')q.jail=0;lg(s,'⏭ '+q.name+' فاته دوره');continue}
  if(q.jail)s.stage='jail';
  break}
 roast(s)}
function doPen(s,i,k){const p=s.pl[i],d=AB[k],o=s.pl.map((x,j)=>j).filter(j=>j!==i&&!s.pl[j].out);lg(s,d[0]+' '+p.name+': '+d[1]);
 if(p.sh>=s.round){lg(s,'🦸 '+p.name+' جاي من طرف يزيد: المصيبة اتلغت');return}
 const P={'!fine':300,'!wedding':400,'!gas':300,'!onion':200,'!delivery':200,'!ahwa':300,'!neighbor':200};
 if(P[k])pay(s,i,P[k],-1);
 else if(k==='!one')p.one=2;else if(k==='!skip'||k==='!hamat'||k==='!aish')p.skip=1;
 else if(k==='!back')p.pos=(p.pos+N-3)%N;else if(k==='!lost')p.pos=0;else if(k==='!kharouf')p.pos=(p.pos+N-4)%N;
 else if(k==='!banana'){p.skip=1;p.pos=(p.pos+N-1)%N}
 else if(k==='!rain'){p.pos=(p.pos+N-2)%N;pay(s,i,200,-1)}
 else if(k==='!salaf'){const b=o.sort((x,y)=>s.pl[x].cash-s.pl[y].cash)[0];if(b!==undefined)pay(s,i,300,b)}
 else if(k==='!jail')toJail(s,i,'اتمسك من غير رخصة');
 else if(k==='!yassin'){p.pos=FI;for(let z=0;z<2;z++){const q=rnd(PEN(s).filter(x=>x!=='!yassin'&&x!=='!jail'));lg(s,'🚗 مصيبة '+(z+1)+': '+AB[q][1]);doPen(s,i,q)}}}
function land(s,i){const p=s.pl[i],t=T[p.pos];p.mag=null;
 if(s.cfg.mag&&t.k!=='f'){const nb=[(p.pos+1)%N,(p.pos+N-1)%N].find(x=>T[x].k==='f');if(nb!==undefined)p.mag=nb}
 if(t.k==='p'){const o=s.own[p.pos];if(o===undefined){s.stage='buy';s.pend={t:p.pos,m:null};return}if(o!==i)rentPay(s,i,p.pos,o)}
 else if(t.k==='z'){lg(s,'🥫 '+p.name+' عند الحاج بثيوني: دفع 500 علبة التونة');pay(s,i,500,-1)}
 else if(t.k==='k'){const x=s.tr||0;s.tr=0;p.cash+=x;lg(s,x?'🍆 '+p.name+' فتح بركة السبع +'+x+' 🎉':'🍆 '+p.name+' وصل بركة السبع والخزنة فاضية')}
 else if(t.k==='f'){const k=rnd(PEN(s));setDrawn(s,k);trafficRoast(s,i);doPen(s,i,k)}
 else if(t.k==='j'){toJail(s,i,'وقف عند منصور')}
 else if(t.k==='g'){p.pos=FI;p.mag=null;lg(s,'🚦 '+p.name+' اتسحب على كمين المرور!');land(s,i);return}
 else if(t.k==='l'){if(Math.random()<.5){p.cash+=1200;lg(s,'🎟 '+p.name+' كسب اليانصيب +1200 🎉')}else{lg(s,'🎟 '+p.name+' ورقة اليانصيب فشلت -500');pay(s,i,500,-1)}}
 else if(t.k==='v'){const a=Math.max(300,r50(p.cash*.1));lg(s,'💡 '+p.name+' دفع فاتورة النور '+a);pay(s,i,a,-1)}
 else if(t.k==='m'){const k=dAb(s);setDrawn(s,k);if(k[0]==='!')doPen(s,i,k);else{if(p.ab.length>=6)p.ab.shift();p.ab.push(k);lg(s,'🛍 '+p.name+' اشترى من السوق كارت «'+AB[k][1]+'»')}}
 if(s.stage!=='buy')endTurn(s)}
function dice(s,p,two){const cr=s.chaos&&s.chaos.id==='crowd',f=v=>cr&&v===6?3:v;let a=1+Math.floor(Math.random()*6),b=(!two&&p.one>0)?0:1+Math.floor(Math.random()*6);
 if(!two){if(p.force&&!(p.one>0)){b=a;p.force=0}if(p.one>0)p.one--}
 s.rn=(s.rn||0)+1;s.dice={a,b,n:s.rn};return[a,b,f(a)+(b?f(b):0)]}
function move(s,i,n,txt){const p=s.pl[i];s.mv2={p:i,f:p.pos,d:1,n};const raw=p.pos+n;if(raw>=N){p.cash+=SAL(s);lg(s,'💰 '+p.name+' عدّى البداية +'+SAL(s))}p.pos=raw%N;lg(s,txt);land(s,i)}
function roll(s){s.drawn=null;const p=s.pl[s.turn],[a,b,n]=dice(s,p),dbl=!!b&&a===b;
 if(dbl){p.dbl=(p.dbl||0)+1;if(p.dbl>=3){s.mv2=null;toJail(s,s.turn,'رمى دوبل 3 مرات ورا بعض');endTurn(s);return}p.extra=1}else p.dbl=0;
 move(s,s.turn,n,'🎲 '+p.name+' رمى '+a+(b?' + '+b:'')+' = '+n+(dbl?' (دوبل! هيلعب تاني)':''))}
function jailRoll(s){s.drawn=null;const i=s.turn,p=s.pl[i],[a,b,n]=dice(s,p,1);
 if(a===b){p.jail=0;p.dbl=0;move(s,i,n,'🎲 '+p.name+' رمى دوبل '+a+' + '+b+' وخرج من سجن منصور 🔓');return}
 p.jail++;if(p.jail>3){p.jail=0;lg(s,'🔓 '+p.name+' خلّص 3 محاولات ودفع الكفالة '+s.cfg.bail);pay(s,i,s.cfg.bail,-1);move(s,i,n,'🎲 '+p.name+' رمى '+a+' + '+b+' = '+n);return}
 lg(s,'🎲 '+p.name+' رمى '+a+' + '+b+' ومطلعش من السجن');s.stage='after'}
function bail(s){const p=s.pl[s.turn];pay(s,s.turn,s.cfg.bail,-1);p.jail=0;s.stage='move';lg(s,'💵 '+p.name+' دفع كفالة '+s.cfg.bail+' وخرج من سجن منصور')}
function jfree(s){const p=s.pl[s.turn];p.ab.splice(p.ab.indexOf('jailfree'),1);p.jail=0;s.stage='move';lg(s,'🗝 '+p.name+' طلع من سجن منصور بالمعرفة')}
const attackOk=(s,j)=>{const q=s.pl[j];if(q.prot){q.prot=0;lg(s,'🛡 '+q.name+' لغى الهجوم بـ«أنا ابن فلان»');return false}return true};
function useAb(s,idx,a){const i=s.turn,p=s.pl[i],k=p.ab.splice(idx,1)[0],o=s.pl.map((x,j)=>j).filter(j=>j!==i&&!s.pl[j].out);let r='';
 const blk=j=>{if(attackOk(s,j))return true;r='حاول عليه '+s.pl[j].name+' بس '+s.pl[j].name+' صدّه بكارت «أنا ابن فلان» 🛡';return false};
 if(k==='wasta'){const d=(a-p.pos+N)%N;if(d<=3&&p.pos+d>=N)p.cash+=SAL(s);r='نقل نفسه من '+nameOf(p.pos)+' لـ'+nameOf(a)}
 else if(k==='sahby'){const q=s.pl[a];if(blk(a)){r='بدّل مكانه مع '+q.name+': هو راح '+nameOf(q.pos)+' و'+q.name+' راح '+nameOf(p.pos);[p.pos,q.pos]=[q.pos,p.pos]}}
 else if(k==='taraf'){p.free=1;r='أول إيجار هيقع عليه بعد كده مش هيدفعه'}
 else if(k==='meter'){s.off[a]=s.round+1;r='إيجار '+T[a].n+' بقى صفر لحد آخر الجولة '+(s.round+1)}
 else if(k==='sheek'){p.cash+=1500;p.debts.push({due:s.round+3,amt:2000});r='خد 1500 من البنك، وهيدفع 2000 في الجولة '+(s.round+3)}
 else if(k==='tahwila'){p.div=a;r='أول إيجار يقع عليه هيدفعه '+s.pl[a].name+' بداله'}
 else if(k==='gerran'){const m=o.filter(j=>free(s,j));m.forEach(j=>s.pl[j].pos=(s.pl[j].pos+N-1)%N);r='رجّع '+(m.map(j=>s.pl[j].name).join(' و')||'محدش')+' خطوة لورا'}
 else if(k==='hesab'){p.defer=1;r='أول إيجار يقع عليه هيتأجل جولتين بزيادة 20%'}
 else if(k==='shufaa'){const w=s.own[a];p.cash-=T[a].p*2;s.pl[w].cash+=T[a].p*2;s.own[a]=i;r='خد '+T[a].n+' غصب عن '+s.pl[w].name+' ودفعله '+T[a].p*2}
 else if(k==='harami'){if(blk(a)){const x=Math.max(0,Math.min(500,s.pl[a].cash));s.pl[a].cash-=x;p.cash+=x;r='سرق '+x+' من '+s.pl[a].name}}
 else if(k==='azooma'){p.force=1;r='رميته الجاية دوبل مضمون'}
 else if(k==='micro'){p.extra=1;r='هياخد دور زيادة بعد دوره'}
 else if(k==='winch'){if(blk(a)){const q=s.pl[a];r='شال '+q.name+' من '+nameOf(q.pos)+' لكمين المرور، وهيسحب مصيبة';q.pos=FI;q.mag=null}}
 else if(k==='yazid'){p.sh=s.round+1;r='نقل نفسه لـ'+nameOf(a)+'، ومفيش إيجار ولا مصايب عليه لحد آخر الجولة '+(s.round+1)}
 else if(k==='teleport'){const j=Math.floor(a/100),t=a%100;if(blk(j)){r='نقل '+s.pl[j].name+' من '+nameOf(s.pl[j].pos)+' لـ'+nameOf(t);s.pl[j].pos=t;s.pl[j].mag=null}}
 else if(k==='shield'){p.prot=1;r='بقى محمي من أول سرقة أو هجوم'}
 else if(k==='nashal'){if(blk(a)){const v=s.pl[a];if(v.ab.length){const c=v.ab.splice(Math.floor(Math.random()*v.ab.length),1)[0];if(p.ab.length>=6)p.ab.shift();p.ab.push(c);r='نشل كارت «'+AB[c][1]+'» من '+v.name}else r='مد إيده في جيب '+v.name+' ولقاه فاضي'}}
 else if(k==='kosheri'){p.cash+=600;r='خد 600 من البنك'}
 else if(k==='dallal'){p.disc=1;r='أول خانة هيشتريها هتبقى بنص السعر'}
 else if(k==='tamween'){p.cash+=800;r='خد 800 من البنك'}
 else if(k==='tok'){const t=(p.pos+2)%N;if(p.pos+2>=N)p.cash+=SAL(s);r='اتحرك خطوتين لـ'+nameOf(t)}
 else if(k==='hadya'){r='سحب كارت قدرة زيادة'}
 else if(k==='bank'){const b=o.slice().sort((x,y)=>s.pl[y].cash-s.pl[x].cash)[0];if(b!==undefined){const x=Math.max(0,Math.floor(s.pl[b].cash*.1/100)*100);s.pl[b].cash-=x;p.cash+=x;r='خد '+x+' من '+s.pl[b].name+' (أغنى واحد)'}}
 else if(k==='gam3'){r='كل لاعب دفعله 250 (المجموع '+o.length*250+')'}
 s.used={n:((s.used&&s.used.n)||0)+1,k,w:p.name,r};lg(s,AB[k][0]+' '+p.name+' لعب «'+AB[k][1]+'»: '+r);
 if(k==='wasta'){p.pos=a;land(s,i)}
 else if(k==='yazid'){p.pos=a;land(s,i)}
 else if(k==='tok'){p.pos=(p.pos+2)%N;land(s,i)}
 else if(k==='winch'&&s.pl[a].pos===FI&&r.startsWith('شال')){const pk=rnd(PEN(s));setDrawn(s,pk,s.pl[a].name);doPen(s,a,pk)}
 else if(k==='hadya'){let x;do x=dAb(s);while(x[0]==='!');if(p.ab.length>=6)p.ab.shift();p.ab.push(x);setDrawn(s,x)}
 else if(k==='gam3')o.forEach(j=>pay(s,j,250,i))}
function buy(s){const p=s.pl[s.turn],pr=price(s);if(p.cash<pr)return;p.cash-=pr;p.disc=0;s.own[s.pend.t]=s.turn;lg(s,'🏠 '+p.name+' اشترى '+T[s.pend.t].n+' بـ'+pr);endTurn(s)}
function dealDraw(s){s.pend.m=dDl(s);lg(s,'🃏 '+s.pl[s.turn].name+' سحب ورقة صفقة: ×'+s.pend.m)}
const canBuild=(s,t,i)=>{const g=T[t].g;return !T[t].pj&&T[t].k==='p'&&fullSet(s,g,i)&&!T.some((x,j)=>x.g===g&&s.mg[j])&&(s.lv[t]||0)<5&&(!s.cfg.even||(s.lv[t]||0)===Math.min(...T.map((x,j)=>x.g===g?(s.lv[j]||0):9)))};
function build(s,t,q){const p=s.pl[s.turn],c=ucost(t);p.cash-=c;s.lv[t]=(s.lv[t]||0)+1;if(!q)lg(s,'🏗 '+p.name+' بنى في '+T[t].n+' (مستوى '+s.lv[t]+') −'+c)}
function buildAll(s,t){const i=s.turn,p=s.pl[i];let n=0,tot=0;for(let k=0;k<30;k++){const j=T.map((x,j)=>j).find(j=>T[j].g===T[t].g&&canBuild(s,j,i)&&p.cash>=ucost(j));if(j===undefined)break;tot+=ucost(j);build(s,j,1);n++}lg(s,'🏗 '+p.name+' بنى '+n+' بيوت في '+GV[T[t].g][0]+' (−'+tot+')')}
const sellVal=(s,t)=>r50(T[t].p*.5)+r50((s.lv[t]||0)*ucost(t)*.5);
function sellP(s,t,pi){const p=s.pl[pi??s.turn],v=sellVal(s,t);p.cash+=v;delete s.own[t];delete s.lv[t];lg(s,'💰 '+p.name+' باع '+T[t].n+' للبنك +'+v)}
function mortgage(s,t,pi){const p=s.pl[pi??s.turn];p.cash+=mgv(t);s.mg[t]=1;lg(s,'🏠 '+p.name+' رهن '+T[t].n+' +'+mgv(t))}
function redeem(s,t){const p=s.pl[s.turn];p.cash-=rdc(t);delete s.mg[t];lg(s,'🔓 '+p.name+' فك رهن '+T[t].n+' −'+rdc(t))}
// السلفة: من 1000 لحد (1000 + 30% من قيمة خاناتك غير المرهونة)، أقصى حاجة 6000. بترجعها +20% بعد 3 جولات، واحدة بس في المرة
const loanLim=(s,i)=>Math.min(6000,1000+Math.floor(props(s,i).filter(t=>!s.mg[t]).reduce((a,t)=>a+T[t].p,0)*.3/500)*500);
const LOPT=(s,i)=>[1000,1500,2000,3000,4000,5000,6000].filter(a=>a<=loanLim(s,i));
const hasLoan=p=>p.debts.some(d=>d.loan),early=d=>r50(d.pr*1.1);
function loan(s,amt,pi){pi=pi??s.turn;const p=s.pl[pi],r=r50(amt*(1+LINT));p.cash+=amt;p.debts.push({due:s.round+LRND,amt:r,pr:amt,loan:1});lg(s,'🏦 '+p.name+' خد سلفة '+amt+' (هيردّ '+r+' في الجولة '+(s.round+LRND)+')')}
function repay(s){const p=s.pl[s.turn],d=p.debts.find(x=>x.loan),a=early(d);p.cash-=a;p.debts=p.debts.filter(x=>x!==d);lg(s,'✅ '+p.name+' سدّد السلفة بدري ('+a+')')}
function tradeDo(s){const t=s.trade,A=s.pl[t.from],B=s.pl[t.to];if(!(A.cash>=t.gm&&B.cash>=t.wm&&t.gp.every(x=>s.own[x]===t.from)&&t.wp.every(x=>s.own[x]===t.to))){lg(s,'⚠️ الصفقة اتلغت (حاجة اتغيرت)');s.trade=null;return}
 A.cash+=t.wm-t.gm;B.cash+=t.gm-t.wm;t.gp.forEach(x=>s.own[x]=t.to);t.wp.forEach(x=>s.own[x]=t.from);lg(s,'🤝 صفقة تمت بين '+A.name+' و'+B.name);s.trade=null}
function surrender(s,i,k){const p=s.pl[i];if(p.out)return;props(s,i).forEach(t=>{delete s.own[t];delete s.lv[t];delete s.mg[t]});p.out=1;p.cash=0;p.debts=[];p.ab=[];p.jail=0;if(k)p.kick=1;lg(s,k?'👢 '+p.name+' اتطرد من صاحب الغرفة':'🏳️ '+p.name+' استسلم وخرج من اللعبة');
 if(s.trade&&(s.trade.from===i||s.trade.to===i))s.trade=null;s.dbt=s.dbt.filter(x=>x!==i);
 if(s.pl.filter(x=>!x.out).length<=1||(s.cfg.first&&!k)){s.phase='end';return}if(s.turn===i)nextTurn(s)}
function settle(s){s.dbt=s.dbt.filter(i=>!s.pl[i].out&&s.pl[i].cash<0)}

// ================= التحقق والتنفيذ (عند المضيف) =================
function opts(k,m){const need=AB[k][3],mi=S.pl.indexOf(m),o=S.pl.map((x,j)=>j).filter(j=>j!==mi&&!S.pl[j].out),r=[];
 if(need==='p'||need==='pt'){const mv=['sahby','teleport','winch'].includes(k);return o.filter(j=>!mv||!S.pl[j].jail).map(j=>[j,S.pl[j].name])}
 if(need==='T')return T.map((t,j)=>[j,nameOf(j)]);
 if(need==='t3'){for(const d of [1,2,3]){const f=(m.pos+d)%N,b=(m.pos-d+N)%N;r.push([f,'◀ '+nameOf(f)]);r.push([b,'▶ '+nameOf(b)])}return r}
 if(need==='tp')return props(S,mi).map(t=>[t,T[t].n]);
 if(need==='to')return Object.keys(S.own).map(Number).filter(t=>S.own[t]!==mi&&m.cash>=T[t].p*2&&!S.mg[t]).map(t=>[t,T[t].n+' ('+T[t].p*2+')']);
 if(need==='J')return[];return null}
function ok(o){const p=S.pl[S.turn];if(!o||typeof o.a!=='string'||S.trade)return false;const a=o.a,c=S.cfg;
 if(a==='r')return S.stage==='move';if(a==='e')return S.stage==='after';
 if(a==='jr')return S.stage==='jail';if(a==='jb')return S.stage==='jail'&&p.cash>=c.bail;if(a==='jf')return S.stage==='jail'&&p.ab.includes('jailfree');
 if(a==='y')return S.stage==='buy'&&p.cash>=price(S);if(a==='d')return S.stage==='buy'&&c.deal&&S.pend.m===null;if(a==='k')return S.stage==='buy';
 if(a==='u'){if(S.stage!=='move'||!Number.isInteger(o.i)||!p.ab[o.i])return false;const k=p.ab[o.i];if(AB[k][3]==='J')return false;if(AB[k][3]==='pt'){const j=Math.floor(o.d/100),t=o.d%100;return Number.isInteger(o.d)&&j!==S.turn&&!!S.pl[j]&&!S.pl[j].out&&!S.pl[j].jail&&t>=0&&t<N}const op=opts(k,p);return !op||(op.length>0&&op.some(x=>x[0]===o.d))}
 if(a==='g'){const t=o.i;return BLD()&&Number.isInteger(t)&&T[t]&&S.own[t]===S.turn&&canBuild(S,t,S.turn)&&p.cash>=ucost(t)}
 if(a==='ga'){const t=o.i;return BLD()&&Number.isInteger(t)&&T[t]&&S.own[t]===S.turn&&T.some((x,j)=>x.g===T[t].g&&canBuild(S,j,S.turn)&&p.cash>=ucost(j))}
 if(a==='s')return AFT()&&Number.isInteger(o.i)&&S.own[o.i]===S.turn&&!S.mg[o.i];
 if(a==='mg')return c.mort&&AFT()&&Number.isInteger(o.i)&&S.own[o.i]===S.turn&&!S.mg[o.i]&&!(S.lv[o.i]>0);
 if(a==='rd')return c.mort&&AFT()&&Number.isInteger(o.i)&&S.own[o.i]===S.turn&&!!S.mg[o.i]&&p.cash>=rdc(o.i);

 if(a==='lr'){const d=p.debts.find(x=>x.loan);return AFT()&&!!d&&p.cash>=early(d)}

 if(s.used&&s.used.n!==((prev.used&&prev.used.n)||0)&&AB[s.used.k]){const u=s.used,d=AB[u.k],mine=!LOCAL&&mi>=0&&s.pl[mi].name===u.w;if(!mine){sfx('tick');vib(40);await showCard(F,d[0],'🎴 '+u.w+' لعب «'+d[1]+'»',u.r,'used',null)}}
 if(s.dn&&s.dn!==(prev.dn||0)&&s.drawn&&AB[s.drawn]){const d=AB[s.drawn],bad=s.drawn[0]==='!';if(bad||LOCAL||(mi>=0&&s.pl[mi].name===s.dw)){sfx(bad?'bad':'good');if(bad)vib([70,40,70]);await showCard(F,d[0],d[1],d[2],bad?'pn':'',s.dw)}}
 for(const m of (s.evs||[]).filter(x=>/^\p{Extended_Pictographic}/u.test(x)).slice(-3)){const ic=(m.match(/^\p{Extended_Pictographic}️?/u)||['📣'])[0];B.innerHTML='';const a=document.createElement('span'),b=document.createElement('span');a.className='bi';a.textContent=ic;b.textContent=m.slice(ic.length).trim();B.append(a,b);B.className='show '+(/[💸🚔😴⚡🕳🧲🚨🏗🌧🍌🔥💍💡📝🔒🥫]/u.test(ic)?'bad':/[💰🎉🏠🎁🍲🏦🛒🏧🍆🔓]/u.test(ic)?'good':'');await sleep(off?900:1250);B.className=''}
 const rm=PF.roast;if(rm!=='off'&&s.rs&&s.rs.n!==((prev.rs&&prev.rs.n)||0)&&(rm==='all'||isY(s.pl[s.rs.i]))){B.innerHTML='';const a=document.createElement('span'),b=document.createElement('span');a.className='bi';a.textContent='😈';b.textContent=s.rs.t;B.append(a,b);B.className='show bad';await sleep(3000);B.className=''}}
async function rollFx(F,d,ch){const cr=ch&&ch.id==='crowd',f=v=>cr&&v===6?3:v,vals=d.b?[d.a,d.b]:[d.a],o=document.createElement('div');o.className='dovl';
 o.innerHTML='<div class=dc>'+vals.map((v,i)=>`<div class="dd roll${i?'2':''}">${pipH(1+Math.floor(Math.random()*6))}</div>`).join('')+'</div><div class=dtot>🎲</div>';F.appendChild(o);sfx('roll');
 const els=[...o.querySelectorAll('.dd')],iv=setInterval(()=>els.forEach(e=>{e.innerHTML=pipH(1+Math.floor(Math.random()*6))}),80);await sleep(850);clearInterval(iv);
 els.forEach((e,i)=>{e.innerHTML=pipH(vals[i]);e.className='dd'});const n=f(d.a)+(d.b?f(d.b):0);o.querySelector('.dtot').textContent=d.b?d.a+' + '+d.b+' = '+n+(d.a===d.b?' · دوبل!':''):''+d.a;vib(25);await sleep(800);o.remove()}

// ================= التايمرات =================
let WL=null,LAST_TN=-1;
async function wl(){if(!PF.wake)return;try{if('wakeLock' in navigator&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&S.phase==='play')wl()});
function onTurnChange(){document.body.classList.remove('busy');wl();if(S.tn!==LAST_TN){LAST_TN=S.tn;if(!LOCAL&&S.pl[S.turn]&&S.pl[S.turn].id===me)vib([50,40,50])}}
setInterval(()=>{if(!S||S.phase!=='play')return;const c=$('clk');if(c)c.textContent=clockTxt();
 if(S.cfg.timer){const left=S.cfg.timer-Math.floor((Date.now()-OFF-(S.now||Date.now()))/1000),e=$('tmr');if(e)e.textContent='⏱ '+Math.max(0,left);
  if(left<=0&&(HOST||LOCAL)&&!ANIM&&!S.dbt.length&&!ask&&!MN){const p=S.pl[S.turn];if(p&&!p.out){const a=S.trade?null:S.stage==='move'?'r':S.stage==='buy'?'k':S.stage==='after'?'e':S.stage==='jail'?'jr':null;
   if(S.trade&&S.pl[S.trade.from]===p)hostApply(p.id,{a:'tc',en:S.en});else if(a)hostApply(p.id,{a,en:S.en})}}}
 if(S.cfg.gmin&&(HOST||LOCAL)){const el=Math.floor((Date.now()-S.gt)/1000);if(el>=S.cfg.gmin*60){const s=clone(S);s.phase='end';s.endWhy='time';lg(s,'⏳ الوقت خلص!');commit(s)}}},1000);

// ================= الشبكة (MQTT) =================
let conn=null,conns=[],HOST=false,mq=null,base='',cmap={};
const pid=()=>{try{let v=localStorage.getItem('bkpid');if(!v){v='u'+Math.random().toString(36).slice(2,10);localStorage.setItem('bkpid',v)}return v}catch(e){return 'u'+Math.random().toString(36).slice(2,10)}};
const nmv=()=>{const n=clean($('nm').value)||'لاعب';try{localStorage.setItem('bknm',n)}catch(e){}return n};
function hostMsg(cn,d){if(!d||!S)return;
 if(d.t==='join'){if((S.ban||[]).includes(String(d.id))){cn.send({t:'kicked'});return}cn.ok=true;const ex=S.pl.some(p=>p.id===d.id);if(S.phase==='lobby'&&!ex&&S.pl.length<10){const s=clone(S);s.pl.push(mkP(String(d.id),clean(d.name)||'لاعب'));fixLook(s);commit(s)}else cn.send({t:'s',s:S})}
 else if(d.t==='look'&&cn.ok&&S.phase==='lobby'){const i=S.pl.findIndex(p=>p.id===String(d.id));if(i>=0&&SHAPES.includes(d.ic)&&COLS.includes(d.col)&&!S.pl.some((p,j)=>j!==i&&p.col===d.col)){const s=clone(S);s.pl[i].ic=d.ic;s.pl[i].col=d.col;commit(s)}}
 else if(d.t==='act'&&cn.ok){const e0=S.en;hostApply(String(d.id),d.o);if(S.en===e0)cn.send({t:'s',s:S})}}
function create(){me=pid();const n=nmv();toast('بجهّز الغرفة…');startHost(null,{phase:'lobby',host:me,cfg:Object.assign({},CFG0),pl:[Object.assign(mkP(me,n),{col:COLS[0]})]})}
const BRK=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789',rc=n=>Array.from({length:n},()=>ALPH[Math.floor(Math.random()*ALPH.length)]).join('');
function mconn(i,ok,fail){if(typeof mqtt==='undefined'){toast('مكتبة الاتصال ماتحمّلتش، جرّب تاني');return}const c=mqtt.connect(BRK[i],{clientId:'bkh_'+rc(10),reconnectPeriod:2000,connectTimeout:7000,clean:true});let done=false;
 c.on('connect',()=>{if(!done){done=true;ok(c)}});c.on('error',()=>{});setTimeout(()=>{if(!done){done=true;try{c.end(true)}catch(e){}fail()}},8000)}
function startHost(c,st){HOST=false;
 const tryB=i=>{if(i>=BRK.length){toast('تعذر الاتصال بأي خادم، جرّب شبكة تانية');return}const idx=c?Number(c[0])-1:i;
  mconn(idx,cl=>{mq=cl;code=c||String(idx+1)+rc(7);base='bkhg/'+code;cl.subscribe(base+'/up');
   cl.on('message',(t,p)=>{let m;try{m=JSON.parse(p.toString())}catch(e){return}if(!m.from||!m.d)return;let cn=cmap[m.from];if(!cn){cn=cmap[m.from]={ok:false,get open(){return !!mq&&mq.connected},send:x=>{try{mq.publish(base+'/dn/'+m.from,JSON.stringify(x))}catch(e){}}};conns.push(cn)}hostMsg(cn,m.d)});
   if(!HOST){HOST=true;S=st;if(!S.host)S.host=me;toast('الغرفة جاهزة ✅ الكود: '+code)}render()},()=>{c?toast('تعذر الاتصال بالخادم'):tryB(i+1)})};
 tryB(0)}
function resume(){try{const v=JSON.parse(localStorage.getItem('bksave'));me=pid();toast('برجّع الغرفة…');startHost(v.code,v.S)}catch(e){toast('تعذر الاستعادة')}}
function join(){me=pid();code=$('cd').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==8||!'123'.includes(code[0])){toast('الكود غلط، لازم 8 حروف وأرقام');return}const n=nmv();toast('بدخل الغرفة…');base='bkhg/'+code;const jm={t:'join',id:me,name:n};
 mconn(Number(code[0])-1,cl=>{mq=cl;cl.subscribe(base+'/dn/'+me);conn={get open(){return !!mq&&mq.connected},send:x=>mq.publish(base+'/up',JSON.stringify({from:me,d:x}))};
  cl.on('message',(t,p)=>{let d;try{d=JSON.parse(p.toString())}catch(e){return}
   if(d&&d.t==='s'){if(S&&S.phase==='play'&&d.s.phase==='play'&&(d.s.en||0)<(S.en||0))return;S=d.s;if(S.now)OFF=Date.now()-S.now;ask=null;if(S.ban&&S.ban.includes(me)&&!S.pl.some(p=>p.id===me)){toast('صاحب الغرفة طردك');S=null;mq.end(true)}render()}
   else if(d&&d.t==='kicked')toast('صاحب الغرفة طردك من الغرفة')});
  cl.on('connect',()=>conn.send(jm));conn.send(jm);setInterval(()=>{if(!S&&conn.open)conn.send(jm)},3000);
  setTimeout(()=>{if(!S)toast('لسه مفيش رد. اتأكد من الكود وإن المضيف فاتح الصفحة')},10000)},()=>toast('تعذر الاتصال بالخادم، جرّب تاني'))}
render();
</script></body></html>
